# Soup training config
# Docs: https://github.com/MakazhanAlpamys/Soup

base: Qwen/Qwen2.5-Coder-0.5B-Instruct
task: sft

data:
  train: ./data/train.jsonl
  format: alpaca
  val_split: 0.1

training:
  epochs: 3
  lr: 2e-5
  batch_size: auto
  lora:
    r: 64
    alpha: 16
    target_modules: auto
  quantization: 4bit

output: ./output
