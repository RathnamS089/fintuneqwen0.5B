
base: Qwen/Qwen2.5-Coder-0.5B-Instruct
task: sft
data:
  train: data/processed/js_soup_train.jsonl
  format: alpaca
  val_split: 0.1
training:
  epochs: 1
  lr: 2e-4
  batch_size: 1
  grad_accum: 2
  max_seq_len: 1024
  quantization: 4bit
  lora:
    r: 8
    alpha: 16
  seed: 42
  output_dir: ./output/smoke
output: ./output/smoke